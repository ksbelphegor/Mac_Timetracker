<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏷 카테고리</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9;
    height: 100vh; display: flex; flex-direction: column;
  }

  /* ── Layout ── */
  .toolbar {
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-bottom:1px solid #21262d; flex-shrink:0;
  }
  .toolbar h2 { font-size:15px; font-weight:600; }
  .toolbar .btn { margin-left:auto; }
  .main { display:flex; flex:1; min-height:0; }
  .tree-panel {
    width:260px; flex-shrink:0;
    border-right:1px solid #21262d;
    display:flex; flex-direction:column;
  }
  .detail-panel { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* ── Tree panel ── */
  .tree-header {
    padding:8px 12px; font-size:11px; font-weight:600;
    color:#8b949e; border-bottom:1px solid #21262d; flex-shrink:0;
  }
  .tree-scroll { flex:1; overflow-y:auto; padding:4px 0; }
  .tree-item {
    padding:6px 10px; cursor:pointer; display:flex; align-items:center; gap:6px;
    border-left:3px solid transparent; transition:all .1s;
  }
  .tree-item:hover { background:#161b22; }
  .tree-item.selected { background:#1f6feb22; border-left-color:#58a6ff; }
  .tree-item .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; border:1px solid #30363d; }
  .tree-item .tname { font-size:12px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .tree-item .tscore { font-size:10px; color:#3fb950; font-weight:600; }
  .tree-item .tarrow { font-size:8px; color:#8b949e; width:12px; text-align:center; transition:transform .15s; }
  .tree-item .tarrow.expanded { transform:rotate(90deg); }
  .tree-item .tarrow.empty { visibility:hidden; }
  .tree-item.depth-1 { padding-left:26px; }
  .tree-item.depth-2 { padding-left:42px; }
  .tree-item.depth-3 { padding-left:58px; }
  .tree-item.depth-4 { padding-left:74px; }
  .tree-children { display:none; }
  .tree-children.open { display:block; }

  /* ── Detail panel ── */
  .detail-header {
    padding:10px 14px; border-bottom:1px solid #21262d;
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .detail-header .dname { font-size:14px; font-weight:600; }
  .detail-header .dbadge {
    font-size:9px; padding:1px 6px; border-radius:8px;
    background:#21262d; color:#585e6a;
  }
  .detail-header .actions { margin-left:auto; display:flex; gap:4px; }
  .detail-empty {
    flex:1; display:flex; align-items:center; justify-content:center;
    color:#585e6a; font-size:13px;
  }

  /* ── Rules list ── */
  .rules-scroll { flex:1; overflow-y:auto; padding:8px 14px; }
  .rules-header {
    display:flex; align-items:center; gap:6px; margin-bottom:8px;
    font-size:11px; color:#8b949e;
  }
  .rules-header .btn { margin-left:auto; }
  .rule-item {
    display:flex; align-items:center; gap:8px;
    padding:6px 10px; border:1px solid #21262d; border-radius:6px;
    margin-bottom:3px; transition:background .15s;
  }
  .rule-item:hover { background:#161b22; }
  .rule-item .rid { font-size:10px; color:#585e6a; min-width:16px; }
  .rule-item .rpat {
    flex:1; font-family:monospace; font-size:12px; color:#f97583;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .rule-item .rci { font-size:9px; color:#585e6a; }
  .rule-empty {
    text-align:center; padding:20px; color:#585e6a; font-size:12px;
  }

  /* ── Input row ── */
  .input-row {
    display:flex; gap:4px; align-items:center; padding:8px 14px;
    border-top:1px solid #21262d; flex-shrink:0;
  }
  .input-row input {
    flex:1; padding:5px 8px; border-radius:6px; border:1px solid #30363d;
    background:#0d1117; color:#c9d1d9; font-size:12px; outline:none;
  }
  .input-row input:focus { border-color:#58a6ff; }

  /* ── Modal ── */
  .modal-overlay {
    display:none; position:fixed; inset:0; background:#00000088;
    align-items:center; justify-content:center; z-index:999;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:#161b22; border:1px solid #30363d; border-radius:12px;
    width:440px; max-height:90vh; overflow-y:auto; padding:20px;
  }
  .modal h3 { font-size:15px; margin-bottom:16px; }
  .modal label { display:block; font-size:11px; color:#8b949e; margin-bottom:4px; margin-top:10px; }
  .modal label:first-of-type { margin-top:0; }
  .modal input, .modal select {
    width:100%; padding:6px 10px; border-radius:6px; border:1px solid #30363d;
    background:#0d1117; color:#c9d1d9; font-size:13px; outline:none;
  }
  .modal input:focus { border-color:#58a6ff; }
  .modal input[type=color] { width:40px; height:32px; padding:2px; cursor:pointer; }
  .modal .row { display:flex; gap:10px; align-items:center; }
  .modal .row > * { flex:1; }
  .modal .modal-actions {
    display:flex; gap:6px; justify-content:flex-end; margin-top:18px;
    border-top:1px solid #21262d; padding-top:14px;
  }
  .modal .btn-danger { margin-right:auto; }
  .modal .toggle-wrap {
    display:flex; align-items:center; gap:8px; margin-top:6px;
  }
  .modal .toggle {
    width:36px; height:20px; border-radius:10px; border:1px solid #30363d;
    background:#21262d; cursor:pointer; position:relative; transition:all .15s;
  }
  .modal .toggle.on { background:#238636; border-color:#238636; }
  .modal .toggle::after {
    content:''; position:absolute; top:2px; left:2px;
    width:14px; height:14px; border-radius:50%; background:#c9d1d9;
    transition:transform .15s;
  }
  .modal .toggle.on::after { transform:translateX(16px); }

  .btn {
    padding:5px 12px; border-radius:6px; border:1px solid #30363d;
    background:#21262d; color:#c9d1d9; font-size:12px; cursor:pointer;
    transition:all .15s; white-space:nowrap;
  }
  .btn:hover { background:#30363d; }
  .btn-primary { background:#238636; border-color:#238636; color:#fff; }
  .btn-primary:hover { background:#2ea043; }
  .btn-sm { padding:2px 8px; font-size:10px; }
  .btn-danger { color:#f85149; border-color:#f8514944; }
  .btn-danger:hover { background:#f8514915; }
  .btn-ok { background:#238636; color:#fff; border-color:#238636; padding:7px 20px; font-size:13px; }
  .btn-ok:hover { background:#2ea043; }
  .btn-cancel { padding:7px 20px; font-size:13px; }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#30363d; border-radius:2px; }
</style>
</head>
<body>

<div class="toolbar">
  <h2>🏷 카테고리</h2>
  <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 카테고리 추가</button>
</div>

<div class="main">
  <!-- 트리 패널 -->
  <div class="tree-panel">
    <div class="tree-header">카테고리</div>
    <div class="tree-scroll" id="tree"></div>
  </div>

  <!-- 상세 패널 -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty" id="detail-empty">← 카테고리를 선택하세요</div>
    <div id="detail-content" style="display:none;flex-direction:column;flex:1;min-height:0;">
      <div class="detail-header">
        <span class="dot" id="detail-dot"></span>
        <span class="dname" id="detail-name"></span>
        <span class="dbadge" id="detail-badge"></span>
        <div class="actions">
          <button class="btn btn-sm" onclick="openEditModal(selectedId)">✏️ 편집</button>
          <button class="btn btn-sm btn-danger" onclick="delCat()">🗑 삭제</button>
        </div>
      </div>
      <div class="rules-scroll" id="rules-list"></div>
      <div class="input-row">
        <input type="text" id="rule-input" placeholder="새 규칙 정규식 입력..."
               onkeydown="if(event.key==='Enter')addRule()">
        <button class="btn btn-sm btn-primary" onclick="addRule()">+ 규칙</button>
      </div>
    </div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">카테고리 편집</h3>
    <label>이름</label>
    <input type="text" id="m-name">
    <label>상위 카테고리</label>
    <select id="m-parent"><option value="">없음 (루트)</option></select>
    <div class="row">
      <div>
        <label>색상</label>
        <div class="row">
          <input type="color" id="m-color">
          <input type="text" id="m-color-hex" placeholder="#rrggbb" style="flex:1;">
        </div>
      </div>
      <div>
        <label>점수 (Productivity)</label>
        <input type="number" id="m-score" value="10">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="m-delete" style="display:none;" onclick="deleteFromModal()">🗑 카테고리 삭제</button>
      <button class="btn btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn btn-ok" onclick="saveModal()">저장</button>
    </div>
  </div>
</div>

<script>
let catsData = [];
let selectedId = null;
let editingId = null; // null = add, number = edit

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ── Tree rendering ──

function hasKids(c) { return c.children && c.children.length > 0; }

function renderTree(nodes, depth) {
  return nodes.map(c => {
    const hk = hasKids(c);
    const expanded = localStorage.getItem('cat-exp-'+c.id) !== '0';
    return `
      <div>
        <div class="tree-item depth-${depth} ${selectedId===c.id?'selected':''}"
             onclick="selectCat(${c.id})">
          <span class="tarrow ${hk?'expanded':''} ${hk?'':'empty'}" onclick="event.stopPropagation();toggleTree(${c.id})">${hk?'▶':''}</span>
          <span class="dot" style="background:${c.color}"></span>
          <span class="tname">${esc(c.name)}</span>
          <span class="tscore">+${c.score||0}</span>
        </div>
        ${hk ? `<div class="tree-children ${expanded?'open':''}" id="tch-${c.id}">${renderTree(c.children, depth+1)}</div>` : ''}
      </div>`;
  }).join('');
}

function toggleTree(id) {
  const el = document.getElementById('tch-'+id);
  if (!el) return;
  el.classList.toggle('open');
  localStorage.setItem('cat-exp-'+id, el.classList.contains('open') ? '1' : '0');
  // Update arrow
  const arrow = el.previousElementSibling?.querySelector('.tarrow');
  if (arrow) arrow.classList.toggle('expanded');
}

function selectCat(id) {
  selectedId = id;
  renderAll();
  showDetail(id);
}

function renderAll() {
  document.getElementById('tree').innerHTML = catsData.length === 0
    ? '<div style="padding:20px;text-align:center;color:#585e6a;font-size:12px;">카테고리가 없습니다</div>'
    : renderTree(catsData, 0);
}

// ── Detail panel ──

function showDetail(id) {
  const c = findCat(catsData, id);
  if (!c) return;
  const panel = document.getElementById('detail-panel');
  document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('detail-content').style.display = 'flex';
  document.getElementById('detail-dot').style.background = c.color;
  document.getElementById('detail-name').textContent = c.name;
  document.getElementById('detail-badge').textContent = '점수 +' + (c.score||0) + (hasKids(c) ? ' · ' + c.children.length + '개 자식' : '');

  const rules = c.rules || [];
  const rulesEl = document.getElementById('rules-list');
  if (rules.length === 0) {
    rulesEl.innerHTML = '<div class="rule-empty">규칙이 없습니다 — 아래에 정규식을 입력하세요</div>';
  } else {
    rulesEl.innerHTML =
      `<div class="rules-header">📋 규칙 (${rules.length}개)</div>` +
      rules.map((r, i) =>
        `<div class="rule-item">
          <span class="rid">${i+1}</span>
          <span class="rpat">${esc(r.pattern)}</span>
          <span class="rci">${r.case_insensitive ? 'CI' : 'CS'}</span>
          <button class="btn btn-sm" onclick="editRule(${r.id},${c.id})">✏️</button>
          <button class="btn btn-sm btn-danger" onclick="delRule(${r.id})">✕</button>
        </div>`
      ).join('');
  }
}

// ── Rules CRUD ──

async function addRule() {
  const input = document.getElementById('rule-input');
  const pattern = input.value.trim();
  if (!pattern || !selectedId) return;
  const r = await fetch('/api/rules', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ category_id: selectedId, pattern })
  });
  if (r.ok) {
    input.value = '';
    await refresh();
  }
}

async function editRule(ruleId, catId) {
  const rules = findCat(catsData, catId)?.rules || [];
  const rule = rules.find(r => r.id === ruleId);
  if (!rule) return;
  const newPat = prompt('규칙 패턴:', rule.pattern);
  if (!newPat) return;
  const ci = prompt('Case insensitive? (y/n):', rule.case_insensitive ? 'y' : 'n') === 'y';
  const r = await fetch('/api/rules/' + ruleId, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ pattern: newPat.trim(), case_insensitive: ci })
  });
  if (r.ok) await refresh();
}

async function delRule(ruleId) {
  if (!confirm('규칙을 삭제할까요?')) return;
  const r = await fetch('/api/rules/' + ruleId, { method:'DELETE' });
  if (r.ok) await refresh();
}

// ── Category CRUD ──

function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = '+ 카테고리 추가';
  document.getElementById('m-name').value = '';
  document.getElementById('m-color').value = '#58a6ff';
  document.getElementById('m-color-hex').value = '#58a6ff';
  document.getElementById('m-score').value = '10';
  document.getElementById('m-delete').style.display = 'none';
  updateParentSelect();
  document.getElementById('modal').classList.add('open');
}

function openEditModal(id) {
  const c = findCat(catsData, id);
  if (!c) return;
  editingId = id;
  document.getElementById('modal-title').textContent = '✏️ ' + c.name;
  document.getElementById('m-name').value = c.name;
  document.getElementById('m-color').value = c.color;
  document.getElementById('m-color-hex').value = c.color;
  document.getElementById('m-score').value = String(c.score || 0);
  document.getElementById('m-delete').style.display = '';
  updateParentSelect(c.parent_id);
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

async function saveModal() {
  const name = document.getElementById('m-name').value.trim();
  const color = document.getElementById('m-color-hex').value.trim() || document.getElementById('m-color').value;
  const score = parseInt(document.getElementById('m-score').value) || 0;
  const parentId = document.getElementById('m-parent').value;
  const body = { name, color, score, regex: '' };
  if (parentId) body.parent_id = parseInt(parentId);

  if (editingId === null) {
    // Add
    const r = await fetch('/api/categories', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    if (r.ok) {
      closeModal();
      const created = await r.json();
      selectedId = created.id;
      await refresh();
    }
  } else {
    // Update
    const r = await fetch('/api/categories/' + editingId, {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    if (r.ok) {
      closeModal();
      await refresh();
    }
  }
}

async function deleteFromModal() {
  if (editingId === null) return;
  if (!confirm('정말 삭제할까요?')) return;
  const r = await fetch('/api/categories/' + editingId, { method:'DELETE' });
  if (r.ok) {
    closeModal();
    if (selectedId === editingId) selectedId = null;
    await refresh();
  }
}

async function delCat() {
  if (!selectedId) return;
  if (!confirm('삭제할까요? (규칙과 함께 삭제)')) return;
  const r = await fetch('/api/categories/' + selectedId, { method:'DELETE' });
  if (r.ok) {
    selectedId = null;
    document.getElementById('detail-content').style.display = 'none';
    document.getElementById('detail-empty').style.display = 'flex';
    await refresh();
  }
}

// ── Helpers ──

function findCat(nodes, id) {
  for (const n of nodes) {
    if (n.id === id) return n;
    if (n.children) { const f=findCat(n.children,id); if(f) return f; }
  }
  return null;
}

function updateParentSelect(selectedParentId) {
  const sel = document.getElementById('m-parent');
  sel.innerHTML = '<option value="">없음 (루트)</option>';
  function addOpts(nodes, depth) {
    for (const n of nodes) {
      if (n.id === editingId) continue; // 자기 자신 제외
      const opt = document.createElement('option');
      opt.value = n.id;
      opt.textContent = '  '.repeat(depth) + n.name;
      sel.appendChild(opt);
      if (n.children) addOpts(n.children, depth+1);
    }
  }
  addOpts(catsData, 0);
  if (selectedParentId) sel.value = String(selectedParentId);
}

async function refresh() {
  const r = await fetch('/api/categories');
  catsData = await r.json();
  renderAll();
  if (selectedId && findCat(catsData, selectedId)) {
    showDetail(selectedId);
  } else {
    selectedId = null;
    document.getElementById('detail-content').style.display = 'none';
    document.getElementById('detail-empty').style.display = 'flex';
  }
}

// ── Init ──
async function load() {
  await refresh();
  // Auto-refresh rules list every 5s
  setInterval(async () => {
    const r = await fetch('/api/categories');
    catsData = await r.json();
    renderAll();
    if (selectedId && findCat(catsData, selectedId)) {
      showDetail(selectedId);
    }
  }, 5000);
}

// Color sync
document.getElementById('m-color').addEventListener('input', function() {
  document.getElementById('m-color-hex').value = this.value;
});
document.getElementById('m-color-hex').addEventListener('input', function() {
  const v = this.value.trim();
  if (/^#[0-9a-f]{6}$/i.test(v)) document.getElementById('m-color').value = v;
});

load();
</script>
</body>
</html>
