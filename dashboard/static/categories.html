<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏷 카테고리</title>
<link rel="stylesheet" href="/static/categories.css">
</head>
<body>

<div class="toolbar">
  <h2>🏷 카테고리</h2>
  <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 카테고리 추가</button>
</div>

<div class="main">
  <!-- 트리 패널 -->
  <div class="tree-panel">
    <div class="tree-header">카테고리</div>
    <div class="tree-scroll" id="tree"></div>
  </div>

  <!-- 상세 패널 -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty" id="detail-empty">← 카테고리를 선택하세요</div>
    <div id="detail-content" style="display:none;flex-direction:column;flex:1;min-height:0;">
      <div class="detail-header">
        <span class="dot" id="detail-dot"></span>
        <span class="dname" id="detail-name"></span>
        <span class="dbadge" id="detail-badge"></span>
        <div class="actions">
          <button class="btn btn-sm" onclick="openEditModal(selectedId)">✏️ 편집</button>
          <button class="btn btn-sm btn-danger" onclick="delCat()">🗑 삭제</button>
        </div>
      </div>
      <div class="rules-scroll" id="rules-list"></div>
      <div class="input-row">
        <input type="text" id="rule-input" placeholder="새 규칙 정규식 입력..."
               onkeydown="if(event.key==='Enter')addRule()">
        <button class="btn btn-sm btn-primary" onclick="addRule()">+ 규칙</button>
      </div>
    </div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">카테고리 편집</h3>
    <label>이름</label>
    <input type="text" id="m-name">
    <label>상위 카테고리</label>
    <select id="m-parent"><option value="">없음 (루트)</option></select>
    <div class="row">
      <div>
        <label>색상</label>
        <div class="row">
          <input type="color" id="m-color">
          <input type="text" id="m-color-hex" placeholder="#rrggbb" style="flex:1;">
        </div>
      </div>
      <div>
        <label>점수 (Productivity)</label>
        <input type="number" id="m-score" value="10">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="m-delete" style="display:none;" onclick="deleteFromModal()">🗑 카테고리 삭제</button>
      <button class="btn btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn btn-ok" onclick="saveModal()">저장</button>
    </div>
  </div>
</div>

<script src="/static/categories.js"></script>
</body>
</html>
