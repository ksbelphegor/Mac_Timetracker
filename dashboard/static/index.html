<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac Time Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; padding: 20px 24px; height: 100vh;
    display: flex; flex-direction: column;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .header h1 { font-size: 20px; }
  .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .status-on { background:#3fb950; box-shadow:0 0 8px #3fb950; }
  .status-off { background:#f85149; }
  .date-nav { display:flex;align-items:center;gap:4px; }
  .date-btn {
    padding:4px 10px; border-radius:6px; border:1px solid #30363d;
    background:#21262d; color:#c9d1d9; cursor:pointer; font-size:13px;
  }
  .date-btn:hover { background:#30363d; }
  .today-btn { color:#58a6ff; font-weight:600; }
  #date-picker {
    padding:4px 8px; border-radius:6px; border:1px solid #30363d;
    background:#0d1117; color:#c9d1d9; font-size:13px;
    color-scheme:dark; cursor:pointer;
  }
  /* ── 탭 ── */
  .tabs { display:flex; gap:0; margin-bottom:12px; border-bottom:1px solid #30363d; }
  .tab-btn {
    padding: 8px 20px; cursor:pointer; font-size:14px; color:#8b949e;
    border:none; background:none; border-bottom:2px solid transparent;
    transition: all 0.15s;
  }
  .tab-btn:hover { color:#c9d1d9; }
  .tab-btn.active { color:#58a6ff; border-bottom-color:#58a6ff; }
  .tab-content { display:none; flex:1; min-height:0; }
  .tab-content.active { display:flex; flex-direction:column; }
  /* ── 홈 탭 ── */
  .grid-2 { display:grid; grid-template-columns:1fr 300px; gap:16px; flex:1; min-height:0; }
  .panel {
    background:#161b22; border:1px solid #30363d; border-radius:12px;
    padding:16px; display:flex; flex-direction:column; overflow:hidden;
  }
  .detail-empty {
    flex:1; display:flex; align-items:center; justify-content:center; color:#8b949e; font-size:15px;
  }
  .detail-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #30363d; }
  .detail-header .app-icon { font-size:22px; }
  .detail-header .app-name { font-size:18px; font-weight:bold; color:#58a6ff; }
  .detail-header .total-time { font-size:16px; color:#3fb950; margin-left:auto; }
  .session-list { flex:1; overflow-y:auto; }
  .session-item { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #21262d; }
  .session-item:last-child { border-bottom:none; }
  .session-body { flex:1; min-width:0; }
  .session-title { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#c9d1d9; }
  .session-time { font-size:11px; color:#8b949e; margin-top:1px; }
  .session-dur { font-size:13px; font-weight:bold; color:#3fb950; min-width:50px; text-align:right; font-variant-numeric:tabular-nums; }
  /* ── 세션 그룹 (같은 페이지끼리 묶음) ── */
  .sg-group { margin-bottom:4px; border:1px solid #21262d; border-radius:10px; overflow:hidden; }
  .sg-header {
    display:flex; align-items:center; gap:6px; padding:8px 10px;
    cursor:pointer; transition:background 0.15s;
    background:#161b22;
  }
  .sg-header:hover { background:#21262d; }
  .sg-title { flex:1; font-size:13px; font-weight:600; color:#c9d1d9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .sg-hdr-start { width:62px; font-size:11px; color:#8b949e; font-variant-numeric:tabular-nums; text-align:right; }
  .sg-hdr-end { width:62px; font-size:11px; color:#8b949e; font-variant-numeric:tabular-nums; text-align:right; }
  .sg-hdr-dur { width:62px; font-size:11px; font-weight:600; color:#3fb950; text-align:right; font-variant-numeric:tabular-nums; }
  .sg-arrow { width:10px; font-size:10px; color:#8b949e; transition:transform 0.2s; flex-shrink:0; }
  .sg-arrow.open { transform:rotate(90deg); }
  .sg-list-header {
    display:flex; align-items:center; gap:6px;
    padding:0 10px 8px; font-size:10px; color:#585e6a; border-bottom:1px solid #21262d; margin-bottom:6px;
  }
  .sg-list-header .lh-btn {
    cursor:pointer; transition:color 0.15s; user-select:none;
  }
  .sg-list-header .lh-btn:hover { color:#c9d1d9; }
  .sg-list-header .lh-btn.active { color:#58a6ff; }
  .sg-list-header .lh-title { flex:1; }
  .sg-list-header .lh-start { width:62px; text-align:right; }
  .sg-list-header .lh-end { width:62px; text-align:right; }
  .sg-list-header .lh-dur { width:62px; text-align:right; }
  .sg-list-header .lh-spacer { width:10px; flex-shrink:0; }
  .sg-body { padding-left:0; margin-top:0; border-top:1px solid #21262d; }
  .sg-item {
    display:flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:4px; font-size:12px; color:#8b949e;
    transition:background 0.1s;
  }
  .sg-item:hover { background:#1c2129; }
  .sg-item-spacer { flex:1; min-width:0; }
  .sg-item-start { width:62px; font-variant-numeric:tabular-nums; text-align:right; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-item-end { width:62px; font-variant-numeric:tabular-nums; text-align:right; font-size:11px; }
  .sg-item-dur { width:62px; text-align:right; font-weight:600; color:#3fb950; font-variant-numeric:tabular-nums; font-size:11px; transition:color 0.3s; }
  .sg-item-title { flex:1; font-size:11px; color:#c9d1d9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:6px; min-width:0; }
  .sg-item-arrow { width:10px; flex-shrink:0; }
  .sg-inner-header {
    display:flex; align-items:center; gap:6px;
    padding:6px 10px 4px; font-size:10px; color:#585e6a; border-bottom:1px solid #21262d; margin-bottom:2px;
  }
  .sg-inner-header .ih-spacer { flex:1; }
  .sg-inner-header .ih-start { width:62px; text-align:right; }
  .sg-inner-header .ih-end { width:62px; text-align:right; }
  .sg-inner-header .ih-dur { width:62px; text-align:right; }
  .sg-inner-header .ih-empty { width:10px; flex-shrink:0; }
  .sg-header-row {
    display:flex; align-items:center; gap:6px;
    padding:3px 10px 6px; font-size:10px; color:#585e6a; border-bottom:1px solid #21262d; margin-bottom:2px;
  }
  .sg-header-row .hdr-start { width:68px; text-align:right; }
  .sg-header-row .hdr-end { width:68px; text-align:right; }
  .sg-header-row .hdr-dur { flex:1; text-align:right; }
  .app-list-scroll { flex:1; overflow-y:auto; }
  .app-item {
    display:flex; align-items:center; gap:8px;
    padding:7px 10px; border-radius:6px; cursor:pointer; transition:background 0.15s; margin-bottom:1px;
  }
  .app-item:hover { background:#21262d; }
  .app-item.active { background:#1f6feb22; border:1px solid #1f6feb44; }
  .app-item-name { flex:1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-right:auto; }
  .app-item-time { font-size:13px; font-weight:bold; color:#3fb950; margin-left:8px; white-space:nowrap; font-variant-numeric:tabular-nums; transition:color 0.3s; }
  .app-icon-img { width:18px; height:18px; border-radius:4px; flex-shrink:0; }
  /* ── 브라우저 탭 ── */
  .browser-search { margin-bottom:10px; }
  .browser-search input {
    width:100%; padding:8px 12px; border-radius:8px; border:1px solid #30363d;
    background:#0d1117; color:#c9d1d9; font-size:13px; outline:none;
  }
  .browser-search input:focus { border-color:#58a6ff; }
  .browser-filters { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .browser-filter-btn {
    padding:4px 10px; border-radius:12px; border:1px solid #30363d;
    background:transparent; color:#8b949e; font-size:11px; cursor:pointer; transition:all 0.15s;
  }
  .browser-filter-btn:hover { border-color:#58a6ff; color:#c9d1d9; }
  .browser-filter-btn.active { background:#1f6feb33; border-color:#1f6feb; color:#58a6ff; }
  .browser-status { color:#8b949e; font-size:12px; margin-bottom:8px; }
  .browser-list { flex:1; overflow-y:auto; }
  .browser-item {
    display:flex; align-items:center; gap:10px;
    padding:7px 0; border-bottom:1px solid #21262d; font-size:13px;
  }
  .browser-item:last-child { border-bottom:none; }
  .browser-item-time { color:#8b949e; min-width:48px; font-size:12px; font-variant-numeric:tabular-nums; }
  .browser-item-app { color:#58a6ff; min-width:80px; font-size:12px; }
  .browser-item-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .browser-item-dur { color:#3fb950; min-width:50px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums; }
  .browser-group { margin-bottom:2px; }
  .browser-group-header {
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    border-radius:6px; cursor:pointer; transition:background 0.15s;
    background:#161b22; border:1px solid #30363d; margin-bottom:2px;
  }
  .browser-group-header:hover { background:#21262d; }
  .browser-group-name { font-size:14px; font-weight:600; color:#58a6ff; flex:1; }
  .browser-group-meta { font-size:11px; color:#8b949e; }
  .browser-group-arrow { font-size:10px; color:#8b949e; transition:transform 0.15s; }
  .browser-group-items { padding-left:16px; }
  /* ── 작업(뽀모도로) 탭 ── */
  .pomodoro-wrap {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  }
  .pomodoro-timer {
    font-size:96px; font-weight:bold; font-variant-numeric:tabular-nums;
    letter-spacing:4px; color:#c9d1d9;
  }
  .pomodoro-timer.work { color:#f0883e; }
  .pomodoro-timer.break { color:#3fb950; }
  .pomodoro-label { font-size:14px; color:#8b949e; margin-top:-10px; }
  .pomodoro-btns { display:flex; gap:10px; }
  .pomodoro-btns button {
    padding:10px 28px; border-radius:10px; border:none; font-size:15px;
    cursor:pointer; transition:all 0.15s; font-weight:600;
  }
  .btn-start { background:#238636; color:#fff; }
  .btn-start:hover { background:#2ea043; }
  .btn-pause { background:#d29922; color:#fff; }
  .btn-pause:hover { background:#e3b341; }
  .btn-reset { background:#21262d; color:#8b949e; border:1px solid #30363d; }
  .btn-reset:hover { color:#c9d1d9; background:#30363d; }
  .pomodoro-stats { text-align:center; margin-top:10px; }
  .pomodoro-stats .count { font-size:36px; font-weight:bold; color:#3fb950; }
  .pomodoro-stats .label { font-size:13px; color:#8b949e; }
  .pomodoro-progress {
    width:320px; height:6px; background:#21262d; border-radius:3px; overflow:hidden;
  }
  .pomodoro-progress-fill {
    height:100%; background:#f0883e; border-radius:3px; transition:width 1s linear;
  }
  .pomodoro-progress-fill.break { background:#3fb950; }
  .pomodoro-setting { display:flex; gap:16px; margin-top:4px; }
  .pomodoro-setting label { font-size:12px; color:#8b949e; }
  .pomodoro-setting input {
    width:50px; padding:4px 6px; border-radius:4px; border:1px solid #30363d;
    background:#0d1117; color:#c9d1d9; text-align:center; font-size:12px;
  }
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#30363d; border-radius:3px; }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:16px;">
    <h1>⏱ Mac Time Tracker</h1>
    <div class="date-nav">
      <button class="date-btn" onclick="changeDate(-1)">◀</button>
      <input type="date" id="date-picker" onchange="onDateChange()">
      <button class="date-btn" onclick="changeDate(1)">▶</button>
      <button class="date-btn today-btn" onclick="goToday()">오늘</button>
    </div>
  </div>
  <span id="status-badge"><span class="status-dot status-off"></span>연결 중...</span>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">🏠 홈</button>
  <button class="tab-btn" data-tab="browser" onclick="switchTab('browser')">🌐 브라우저</button>
  <button class="tab-btn" data-tab="work" onclick="switchTab('work')">🍅 작업</button>
</div>

<!-- ══════ 홈 탭 ══════ -->
<div class="tab-content active" id="tab-home">
  <div class="grid-2">
    <div class="panel" id="home-detail">
      <div class="detail-empty" id="home-empty">👈 앱을 선택하면 창 제목 기록 표시</div>
      <div id="home-content" style="display:none;flex-direction:column;flex:1;min-height:0;">
        <div class="detail-header">
          <span class="app-icon">📌</span>
          <span class="app-name" id="home-app-name">—</span>
          <span class="total-time" id="home-total-time">—</span>
        </div>
        <div class="session-list" id="home-sessions"></div>
      </div>
    </div>
    <div class="panel">
      <div style="font-size:12px;color:#8b949e;margin-bottom:10px;">앱 목록</div>
      <div class="app-list-scroll" id="home-app-list"></div>
    </div>
  </div>
</div>

<!-- ══════ 브라우저 탭 ══════ -->
<div class="tab-content" id="tab-browser">
  <div class="panel" style="flex:1;min-height:0;">
    <div class="browser-search">
      <input type="text" id="browser-search-input" placeholder="🔍 탭 제목 검색..." oninput="loadBrowserSessions()">
    </div>
    <div class="browser-filters" id="browser-filters"></div>
    <div class="browser-status" id="browser-status">로딩 중...</div>
    <div class="browser-list" id="browser-list"></div>
  </div>
</div>

<!-- ══════ 작업 탭 (뽀모도로) ══════ -->
<div class="tab-content" id="tab-work">
  <div class="pomodoro-wrap">
    <div class="pomodoro-label" id="pomo-label">작업 시간</div>
    <div class="pomodoro-timer work" id="pomo-timer">25:00</div>
    <div class="pomodoro-progress">
      <div class="pomodoro-progress-fill" id="pomo-progress" style="width:100%"></div>
    </div>
<div class="pomodoro-btns">
  <button class="btn-start" id="pomo-start" onclick="pomoStart()">▶ 시작</button>
  <button class="btn-pause" id="pomo-pause" onclick="pomoPause()" style="display:none">⏸ 일시정지</button>
  <button class="btn-reset" id="pomo-stop" onclick="pomoStop()" style="display:none">■ 중지</button>
  <button class="btn-reset" onclick="pomoReset()">⟲ 초기화</button>
</div>
    <div class="pomodoro-stats">
      <div class="count" id="pomo-count">0</div>
      <div class="label">완료한 🍅</div>
    </div>
    <div class="pomodoro-setting">
      <label>작업 <input type="number" id="pomo-work-min" value="25" min="1" max="120" onchange="pomoUpdateSettings()"> 분</label>
      <label>휴식 <input type="number" id="pomo-break-min" value="5" min="1" max="30" onchange="pomoUpdateSettings()"> 분</label>
    </div>
  </div>
</div>

<script>
/* ═══════════ 공통 ═══════════ */
let selectedDate = new Date().toISOString().slice(0, 10); // YYYY-MM-DD

function fmt(secs) {
  const h = Math.floor(secs / 3600), m = Math.floor((secs%3600)/60), s = Math.floor(secs%60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtDur(secs) {
  const h = Math.floor(secs / 3600), m = Math.floor((secs%3600)/60), s = Math.floor(secs%60);
  if (h > 0) return `${h}시간 ${m}분 ${s}초`;
  if (m > 0) return `${m}분 ${s}초`;
  return `${s}초`;
}
function fmtTime(ts) {
  return new Date(ts*1000).toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
}
function fmtTimePrecise(ts) {
  const d = new Date(ts*1000);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function esc(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function escAttr(s) {
  return esc(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

/* ═══════════ 날짜 ═══════════ */
function initDatePicker() {
  document.getElementById('date-picker').value = selectedDate;
}

function onDateChange() {
  selectedDate = document.getElementById('date-picker').value;
  refreshAll();
}

function changeDate(delta) {
  const d = new Date(selectedDate);
  d.setDate(d.getDate() + delta);
  selectedDate = d.toISOString().slice(0, 10);
  document.getElementById('date-picker').value = selectedDate;
  refreshAll();
}

function goToday() {
  selectedDate = new Date().toISOString().slice(0, 10);
  document.getElementById('date-picker').value = selectedDate;
  refreshAll();
}

function refreshAll() {
  loadHome();
  if (document.getElementById('tab-browser').classList.contains('active')) loadBrowserSessions();
}

function dateParam() {
  const today = new Date().toISOString().slice(0, 10);
  return selectedDate !== today ? `?target_date=${selectedDate}` : '';
}

/* ═══════════ 탭 전환 ═══════════ */
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-'+name));
  if (name === 'browser') loadBrowserSessions();
}

/* ═══════════ 홈 탭 ═══════════ */
let homeSelected = null;
let sgSortBy = 'end';
let sgSortDir = 'desc';
let expandedTitles = new Set();

function sgId(title) { return 'sg-' + title.replace(/[^a-z0-9가-힣\s_-]/gi, '').slice(0, 60).replace(/\s/g, '_'); }

function sortSG(col) {
  if (sgSortBy === col) sgSortDir = sgSortDir === 'asc' ? 'desc' : 'asc';
  else { sgSortBy = col; sgSortDir = 'desc'; }
  if (homeSelected) loadHomeSessions(homeSelected);
}

function getSGSorter() {
  const { by, dir } = { by: sgSortBy, dir: sgSortDir };
  const mult = dir === 'desc' ? -1 : 1;
  return (a, b) => {
    let va, vb;
    if (by === 'title') { va = a.title; vb = b.title; return va < vb ? -mult : va > vb ? mult : 0; }
    if (by === 'start') { va = a.sessions[0].start; vb = b.sessions[0].start; }
    else if (by === 'end') { va = a.sessions[a.sessions.length-1].end; vb = b.sessions[b.sessions.length-1].end; }
    else { va = a.total; vb = b.total; }
    return (va - vb) * mult;
  };
}

function sortArrow(col) {
  if (sgSortBy !== col) return '';
  return sgSortDir === 'asc' ? ' ▲' : ' ▼';
}

async function loadHome() {
  try {
    const res = await fetch('/api/today' + dateParam());
    const data = await res.json();
    document.getElementById('status-badge').innerHTML =
      `<span class="status-dot status-on"></span>연결됨`;

    const listEl = document.getElementById('home-app-list');
    const existing = listEl.children;

    // 구조가 같으면 DOM 갈아엎지 않고 시간만 업데이트 (깜빡임 방지)
    let same = existing.length === data.apps.length;
    if (same) {
      for (let i = 0; i < data.apps.length; i++) {
        const nameEl = existing[i]?.querySelector('.app-item-name');
        if (!nameEl || nameEl.textContent !== data.apps[i].name) {
          same = false;
          break;
        }
      }
    }

    if (same) {
      for (let i = 0; i < data.apps.length; i++) {
        const a = data.apps[i];
        const item = existing[i];
        item.querySelector('.app-item-time').textContent = fmt(a.seconds);
        item.classList.toggle('active', homeSelected === a.name);
      }
    } else {
      listEl.innerHTML = data.apps.map(a =>
        `<div class="app-item ${homeSelected === a.name ? 'active' : ''}"
             onclick="selectHomeApp('${escAttr(a.name)}')">
          <img class="app-icon-img" src="/api/app-icon/${encodeURIComponent(a.name)}"
               alt="" loading="lazy"
               onerror="this.style.display='none'">
          <span class="app-item-name">${esc(a.name)}</span>
          <span class="app-item-time">${fmt(a.seconds)}</span>
        </div>`
      ).join('');
    }

    if (homeSelected) {
      const exists = data.apps.some(a => a.name === homeSelected);
      if (!exists) { homeSelected = null; showHomeEmpty(); }
      else loadHomeSessions(homeSelected);
    }
  } catch(e) {
    document.getElementById('status-badge').innerHTML =
      `<span class="status-dot status-off"></span>연결 오류`;
    console.error('loadHome:', e);
  }
}

function selectHomeApp(name) {
  homeSelected = name;
  document.getElementById('home-content').style.display = 'flex';
  document.getElementById('home-empty').style.display = 'none';
  document.getElementById('home-app-name').textContent = name;
  // 클릭 즉시 active 클래스 적용
  document.querySelectorAll('#home-app-list .app-item').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().startsWith(name));
  });
  loadHomeSessions(name);
}

function showHomeEmpty() {
  homeSelected = null;
  document.getElementById('home-content').style.display = 'none';
  document.getElementById('home-empty').style.display = 'flex';
}

async function loadHomeSessions(name) {
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(name)}?target_date=${selectedDate}`);
    const data = await res.json();
    const listEl = document.getElementById('home-sessions');
    let total = 0;

    // 같은 사이트(도메인) 또는 창 제목끼리 그룹핑
    const groups = {};
    for (const s of data.sessions) {
      const domain = extractDomain(s.url);
      const key = domain || s.title || '(알 수 없음)';
      if (!groups[key]) groups[key] = { title: key, sessions: [], total: 0 };
      groups[key].sessions.push(s);
      groups[key].total += s.duration;
      total += s.duration;
    }

    // 그룹핑 + 정렬 + 상위 30개
    const sorter = getSGSorter();
    const sorted = Object.values(groups).sort(sorter).slice(0, 30);

    listEl.innerHTML = `
      <div class="sg-list-header">
        <span class="lh-title lh-btn ${sgSortBy==='title'?'active':''}" onclick="sortSG('title')">사이트${sortArrow('title')}</span>
        <span class="lh-start lh-btn ${sgSortBy==='start'?'active':''}" onclick="sortSG('start')">시작${sortArrow('start')}</span>
        <span class="lh-end lh-btn ${sgSortBy==='end'?'active':''}" onclick="sortSG('end')">종료${sortArrow('end')}</span>
        <span class="lh-dur lh-btn ${sgSortBy==='duration'?'active':''}" onclick="sortSG('duration')">활성화${sortArrow('duration')}</span>
        <span class="lh-spacer"></span>
      </div>
      ${sorted.map((g, gi) => {
        const first = g.sessions[0];
        const last = g.sessions[g.sessions.length - 1];
        const durSec = Math.round(g.total);
        const durStr = durSec >= 60 ? `${Math.floor(durSec/60)}분 ${durSec%60}초` : `${durSec}초`;
        const id = sgId(g.title);
        const isOpen = expandedTitles.has(g.title);
        return `<div class="sg-group">
        <div class="sg-header" onclick="toggleSG('${escAttr(g.title)}')">
          <span class="sg-title">🌐 ${esc(g.title)}</span>
          <span class="sg-hdr-start">${fmtTimePrecise(first.start)}</span>
          <span class="sg-hdr-end">${fmtTimePrecise(last.end)}</span>
          <span class="sg-hdr-dur">${durStr}</span>
          <span class="sg-arrow" id="arr-${id}">${isOpen?'▼':'▶'}</span>
        </div>
        <div class="sg-body" id="${id}" style="display:${isOpen?'':'none'}">
          <div class="sg-inner-header">
            <span class="ih-spacer" style="flex:1;font-size:10px;color:#585e6a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">페이지</span>
            <span class="ih-start">시작</span>
            <span class="ih-end">종료</span>
            <span class="ih-dur">활성화</span>
            <span class="ih-empty"></span>
          </div>
          ${g.sessions.sort((a, b) => b.end - a.end).map(s => {
            const sDurSec = Math.round(s.duration);
            const sDurStr = sDurSec >= 60 ? `${Math.floor(sDurSec/60)}분 ${sDurSec%60}초` : `${sDurSec}초`;
            return `<div class="sg-item">
              <span class="sg-item-title">📄 ${esc(s.title||'')}</span>
              <span class="sg-item-start">${fmtTimePrecise(s.start)}</span>
              <span class="sg-item-end">${fmtTimePrecise(s.end)}</span>
              <span class="sg-item-dur">${sDurStr}</span>
              <span class="sg-item-arrow"></span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
      }).join('')}
    `;

    document.getElementById('home-total-time').textContent = fmt(total);
  } catch(e) { console.error('loadHomeSessions:', e); }
}

function toggleSG(title) {
  const id = sgId(title);
  const body = document.getElementById(id);
  const arr = document.getElementById('arr-' + id);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  if (arr) arr.textContent = open ? '▶' : '▼';
  if (open) expandedTitles.delete(title);
  else expandedTitles.add(title);
}

/* ═══════════ 브라우저 탭 ═══════════ */
let browserFilter = '__all__';
let groupBySite = false;

function extractSite(title, app) {
  // 탭 제목에서 사이트명 추출
  // 패턴: "title - site" 또는 "title | site" (마지막 구분자)
  const patterns = [/ \| ([^|]+)$/, / — ([^—]+)$/, / - ([^-]+)$/, / – ([^–]+)$/];
  for (const p of patterns) {
    const m = title.match(p);
    if (m) return m[1].trim();
  }
  // 구분자가 없으면 앱명 반환
  return app;
}
function extractDomain(url) {
  if (!url) return null;
  try {
    let h = new URL(url).hostname;
    // Remove www./m./mobile. prefixes for cleaner grouping
    h = h.replace(/^(www|m|mobile)\./, '');
    return h;
  }
  catch(e) { return null; }
}

function filterBrowser(app) {
  browserFilter = app;
  document.querySelectorAll('.browser-filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.app === app));
  loadBrowserSessions();
}

function toggleSiteGroup() {
  groupBySite = !groupBySite;
  document.getElementById('browser-group-toggle').classList.toggle('active');
  loadBrowserSessions();
}

function expandSite(siteKey) {
  const el = document.getElementById('bs-' + siteKey);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function loadBrowserSessions() {
  const search = (document.getElementById('browser-search-input').value || '').toLowerCase();
  const statusEl = document.getElementById('browser-status');
  const listEl = document.getElementById('browser-list');
  const filterEl = document.getElementById('browser-filters');
  try {
    const res = await fetch('/api/browser-sessions?target_date=' + selectedDate);
    const data = await res.json();
    let sessions = data.sessions;

    // 브라우저 필터 버튼 생성 (1회)
    if (!filterEl.dataset.initialized) {
      const apps = [...new Set(sessions.map(s => s.app))];
      filterEl.innerHTML =
        `<button class="browser-filter-btn active" data-app="__all__" onclick="filterBrowser('__all__')">전체</button>`
        + apps.map(a => `<button class="browser-filter-btn" data-app="${esc(a)}" onclick="filterBrowser('${esc(a)}')">${esc(a)}</button>`).join('')
        + `<button class="browser-filter-btn" id="browser-group-toggle" onclick="toggleSiteGroup()">📁 사이트별</button>`;
      filterEl.dataset.initialized = '1';
    }

    // 필터
    if (browserFilter !== '__all__') sessions = sessions.filter(s => s.app === browserFilter);
    if (search) sessions = sessions.filter(s => s.title.toLowerCase().includes(search));

    if (groupBySite) {
      // 사이트별 그룹화
      const groups = {};
      for (const s of sessions) {
        const site = extractSite(s.title, s.app);
        if (!groups[site]) groups[site] = { site, apps: new Set(), total: 0, sessions: [] };
        groups[site].apps.add(s.app);
        groups[site].total += s.duration;
        groups[site].sessions.push(s);
      }
      const sorted = Object.values(groups).sort((a, b) => b.total - a.total);
      statusEl.textContent = `📁 ${sorted.length}개 사이트 · 총 ${sessions.length}개 탭 기록`;
      listEl.innerHTML = sorted.slice(0, 50).map((g, i) => {
        const siteKey = esc(g.site).replace(/\s/g, '_') + i;
        const appsList = [...g.apps].map(a => a.replace(' Browser','')).join(', ');
        return `<div class="browser-group">
          <div class="browser-group-header" onclick="expandSite('${siteKey}')">
            <span class="browser-group-name">📁 ${esc(g.site)}</span>
            <span class="browser-group-meta">${appsList} · ${fmtDur(g.total)}</span>
            <span class="browser-group-arrow">▶</span>
          </div>
          <div class="browser-group-items" id="bs-${siteKey}" style="display:none">
            ${g.sessions.map(s => `
              <div class="browser-item">
                <span class="browser-item-time">${fmtTime(s.start)}</span>
                <span class="browser-item-app">${esc(s.app.replace(' Browser',''))}</span>
                <span class="browser-item-title">${esc(s.title)}</span>
                <span class="browser-item-dur">${fmtDur(s.duration)}</span>
              </div>
            `).join('')}
          </div>
        </div>`;
      }).join('');
    } else {
      // 기본: 시간순 목록
      statusEl.textContent = `총 ${sessions.length}개 탭 기록`;
      listEl.innerHTML = sessions.slice(0, 100).map(s =>
        `<div class="browser-item">
          <span class="browser-item-time">${fmtTime(s.start)}</span>
          <span class="browser-item-app">${esc(s.app.replace(' Browser',''))}</span>
          <span class="browser-item-title">${esc(s.title)}</span>
          <span class="browser-item-dur">${fmtDur(s.duration)}</span>
        </div>`
      ).join('');
    }
  } catch(e) {
    statusEl.textContent = '로딩 실패';
    console.error('loadBrowserSessions:', e);
  }
}

/* ═══════════ 뽀모도로 ═══════════ */
let pomo = {
  state: 'idle', // idle | work | break
  workSec: 25*60, breakSec: 5*60,
  remaining: 25*60, count: 0,
  timerId: null,
};

function pomoUpdateSettings() {
  pomo.workSec = parseInt(document.getElementById('pomo-work-min').value) * 60;
  pomo.breakSec = parseInt(document.getElementById('pomo-break-min').value) * 60;
  if (pomo.state === 'idle') {
    pomo.remaining = pomo.workSec;
    pomoRender();
  }
}

function pomoStart() {
  const isPaused = pomo.state === 'paused-work' || pomo.state === 'paused-break';
  if (pomo.state === 'idle' || isPaused) {
    if (pomo.state === 'idle') {
      pomo.remaining = pomo.workSec;
      pomo.state = 'work';
    } else {
      pomo.state = pomo.state === 'paused-work' ? 'work' : 'break';
    }
    document.getElementById('pomo-start').style.display = 'none';
    document.getElementById('pomo-pause').style.display = '';
    document.getElementById('pomo-stop').style.display = '';
    pomo.timerId = setInterval(pomoTick, 1000);
    pomoRender();
  }
}

function pomoPause() {
  if (pomo.state === 'work') pomo.state = 'paused-work';
  else if (pomo.state === 'break') pomo.state = 'paused-break';
  clearInterval(pomo.timerId);
  document.getElementById('pomo-start').style.display = '';
  document.getElementById('pomo-start').textContent = '▶ 재개';
  document.getElementById('pomo-pause').style.display = 'none';
  pomoRender();
}

function pomoStop() {
  clearInterval(pomo.timerId);
  pomo.state = 'idle';
  pomo.remaining = pomo.workSec;
  document.getElementById('pomo-start').style.display = '';
  document.getElementById('pomo-start').textContent = '▶ 시작';
  document.getElementById('pomo-pause').style.display = 'none';
  document.getElementById('pomo-stop').style.display = 'none';
  pomoRender();
}

function pomoReset() {
  clearInterval(pomo.timerId);
  pomo.state = 'idle';
  pomo.remaining = pomo.workSec;
  document.getElementById('pomo-start').style.display = '';
  document.getElementById('pomo-start').textContent = '▶ 시작';
  document.getElementById('pomo-pause').style.display = 'none';
  pomoRender();
}

function pomoTick() {
  pomo.remaining--;
  if (pomo.remaining <= 0) {
    clearInterval(pomo.timerId);
    if (pomo.state === 'work') {
      pomo.count++;
      pomo.state = 'break';
      pomo.remaining = pomo.breakSec;
      document.getElementById('pomo-count').textContent = pomo.count;
      playNotification('🍅 작업 완료! 휴식 시간!');
    } else {
      pomo.state = 'work';
      pomo.remaining = pomo.workSec;
      playNotification('☕ 휴식 끝! 다시 작업 시작!');
    }
    document.getElementById('pomo-start').style.display = '';
    document.getElementById('pomo-start').textContent = '▶ 시작';
    document.getElementById('pomo-pause').style.display = 'none';
    document.getElementById('pomo-stop').style.display = 'none';
    pomo.timerId = setInterval(pomoTick, 1000);
  }
  pomoRender();
}

function playNotification(msg) {
  if (Notification.permission === 'granted') {
    new Notification('🍅 Mac Time Tracker', { body: msg });
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission();
  }
}

function pomoRender() {
  const timer = document.getElementById('pomo-timer');
  const label = document.getElementById('pomo-label');
  const progress = document.getElementById('pomo-progress');

  const m = Math.floor(pomo.remaining / 60);
  const s = pomo.remaining % 60;
  timer.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  const isWork = pomo.state === 'work' || pomo.state === 'paused-work' || pomo.state === 'idle';
  timer.className = 'pomodoro-timer ' + (isWork ? 'work' : 'break');
  progress.className = 'pomodoro-progress-fill ' + (isWork ? '' : 'break');

  const total = isWork ? pomo.workSec : pomo.breakSec;
  progress.style.width = (total > 0 ? (pomo.remaining / total * 100) : 0) + '%';

  if (pomo.state === 'idle') label.textContent = '🍅 준비 완료';
  else if (isWork) label.textContent = '🔥 작업 중...';
  else label.textContent = '☕ 휴식 중...';
}

/* ═══════════ 새로고침 ═══════════ */
function refresh() { loadHome(); }
initDatePicker();
refresh();
setInterval(refresh, 5000);

// 알림 권한 요청
if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
</script>
