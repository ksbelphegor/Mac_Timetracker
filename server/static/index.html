<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac Time Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; padding: 24px; height: 100vh;
    display: flex; flex-direction: column;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #30363d;
  }
  .header h1 { font-size: 22px; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  .status-on { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
  .status-off { background: #f85149; }
  .main-grid {
    display: grid; grid-template-columns: 1fr 320px; gap: 16px;
    flex: 1; min-height: 0;
  }
  /* ── 왼쪽: 상세 패널 ── */
  .detail-panel {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 20px; display: flex; flex-direction: column; overflow: hidden;
  }
  .detail-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid #30363d;
  }
  .detail-header .app-icon { font-size: 28px; }
  .detail-header .app-name { font-size: 24px; font-weight: bold; color: #58a6ff; }
  .detail-header .total-time { font-size: 18px; color: #3fb950; margin-left: auto; }
  .detail-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #8b949e; font-size: 16px; gap: 8px;
  }

  /* 세션 리스트 */
  .session-list { flex: 1; overflow-y: auto; }
  .session-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid #21262d;
  }
  .session-item:last-child { border-bottom: none; }
  .session-icon { font-size: 14px; min-width: 20px; text-align: center; }
  .session-body { flex: 1; min-width: 0; }
  .session-title {
    font-size: 14px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #c9d1d9;
  }
  .session-time {
    font-size: 12px; color: #8b949e; margin-top: 2px;
  }
  .session-duration {
    font-size: 14px; font-weight: bold; color: #3fb950; min-width: 60px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  /* ── 오른쪽: 앱 목록 ── */
  .app-panel {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; overflow: hidden;
  }
  .app-panel h2 {
    font-size: 13px; color: #8b949e; margin-bottom: 12px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .app-list { flex: 1; overflow-y: auto; }
  .app-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    transition: background 0.15s; margin-bottom: 2px;
  }
  .app-item:hover { background: #21262d; }
  .app-item.active { background: #1f6feb22; border: 1px solid #1f6feb44; }
  .app-item-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-item-time {
    font-size: 13px; font-weight: bold; color: #3fb950; margin-left: 8px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  /* 스크롤 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>⏱ Mac Time Tracker</h1>
  <span id="status-badge"><span class="status-dot status-off"></span>연결 중...</span>
</div>

<div class="main-grid">
  <!-- 왼쪽: 상세 기록 -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty" id="detail-empty">
      <span>👈</span> 앱을 선택하면 여기에 창 제목 기록이 표시됩니다
    </div>
    <div id="detail-content" style="display:none;flex-direction:column;flex:1;min-height:0;">
      <div class="detail-header">
        <span class="app-icon" id="detail-icon">📌</span>
        <span class="app-name" id="detail-app-name">—</span>
        <span class="total-time" id="detail-total-time">—</span>
      </div>
      <div class="session-list" id="session-list"></div>
    </div>
  </div>

  <!-- 오른쪽: 앱 목록 -->
  <div class="app-panel">
    <h2>앱 목록</h2>
    <div class="app-list" id="app-list"></div>
  </div>
</div>

<script>
let selectedApp = null;

function fmt(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m ${s}s`;
}

function fmtDuration(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  if (h > 0) return `${h}시간 ${m}분 ${s}초`;
  if (m > 0) return `${m}분 ${s}초`;
  return `${s}초`;
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── 앱 목록 로드 (오른쪽) ──

async function loadAppList() {
  try {
    const res = await fetch('/api/today');
    const data = await res.json();

    document.getElementById('status-badge').innerHTML =
      `<span class="status-dot status-on"></span>연결됨`;

    const listEl = document.getElementById('app-list');
    listEl.innerHTML = data.apps.map(a => `
      <div class="app-item ${selectedApp === a.name ? 'active' : ''}"
           onclick="selectApp('${escHtml(a.name)}')">
        <span class="app-item-name">${escHtml(a.name)}</span>
        <span class="app-item-time">${fmt(a.seconds)}</span>
      </div>
    `).join('');

    // 선택된 앱이 있으면 세션도 갱신
    if (selectedApp) {
      // 선택된 앱이 목록에 없으면 해제
      const exists = data.apps.some(a => a.name === selectedApp);
      if (!exists) {
        selectedApp = null;
        showEmpty();
      } else {
        // total 시간 업데이트
        const appData = data.apps.find(a => a.name === selectedApp);
        if (appData) {
          document.getElementById('detail-total-time').textContent = fmt(appData.seconds);
        }
        loadSessions(selectedApp);
      }
    }

  } catch(e) {
    document.getElementById('status-badge').innerHTML =
      `<span class="status-dot status-off"></span>연결 오류`;
  }
}

// ── 세션 로드 (왼쪽) ──

function selectApp(appName) {
  selectedApp = appName;
  document.getElementById('detail-content').style.display = 'flex';
  document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('detail-app-name').textContent = appName;

  // app-list 하이라이트 갱신
  document.querySelectorAll('.app-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.app-item').forEach(el => {
    if (el.textContent.trim().startsWith(appName)) {
      el.classList.add('active');
    }
  });

  loadSessions(appName);
}

function showEmpty() {
  selectedApp = null;
  document.getElementById('detail-content').style.display = 'none';
  document.getElementById('detail-empty').style.display = 'flex';
}

async function loadSessions(appName) {
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(appName)}`);
    const data = await res.json();
    const listEl = document.getElementById('session-list');
    const totalEl = document.getElementById('detail-total-time');
    let totalSecs = 0;

    if (data.sessions.length === 0) {
      listEl.innerHTML = '<div style="color:#8b949e;text-align:center;padding:20px;">기록된 세션이 없습니다</div>';
      return;
    }

    listEl.innerHTML = data.sessions.map(s => {
      totalSecs += s.duration;
      return `
        <div class="session-item">
          <span class="session-icon">📄</span>
          <div class="session-body">
            <div class="session-title">${escHtml(s.title)}</div>
            <div class="session-time">${fmtTime(s.start)} ~ ${fmtTime(s.end)}</div>
          </div>
          <span class="session-duration">${fmtDuration(s.duration)}</span>
        </div>
      `;
    }).join('');

    totalEl.textContent = fmt(totalSecs);

  } catch(e) {
    document.getElementById('session-list').innerHTML =
      '<div style="color:#f85149;text-align:center;padding:20px;">로드 실패</div>';
  }
}

// ── 새로고침 ──

function refresh() {
  loadAppList();
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
