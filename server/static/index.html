<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac Time Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; padding: 24px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #30363d;
  }
  .header h1 { font-size: 24px; }
  .current-app {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 20px; margin-bottom: 24px; display: flex;
    justify-content: space-between; align-items: center;
  }
  .current-app .app-name { font-size: 28px; font-weight: bold; color: #58a6ff; }
  .current-app .app-label { font-size: 12px; color: #8b949e; }
  .current-app .total-time { font-size: 36px; font-weight: bold; color: #3fb950; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px;
  }
  .card h2 { font-size: 14px; color: #8b949e; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .card-full { grid-column: 1 / -1; }
  .app-list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #21262d;
  }
  .app-list-item:last-child { border-bottom: none; }
  .app-list-name { font-size: 14px; }
  .app-list-time { font-size: 14px; font-weight: bold; color: #3fb950; }
  .chart-container { position: relative; height: 200px; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  .status-on { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
  .status-off { background: #f85149; }
  .nav {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .nav button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .nav button:hover { background: #30363d; }
  .nav button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  .updating { color: #8b949e; font-size: 11px; text-align: right; margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>⏱ Mac Time Tracker</h1>
  <span id="status-badge"><span class="status-dot status-off"></span>연결 중...</span>
</div>

<div class="current-app" id="current-app-card">
  <div>
    <div class="app-label">현재 사용 중</div>
    <div class="app-name" id="current-app-name">—</div>
    <div class="app-label" id="current-app-title" style="margin-top:4px;"></div>
  </div>
  <div style="text-align:right">
    <div class="app-label">오늘 총 사용 시간</div>
    <div class="total-time" id="total-time-display">00:00:00</div>
  </div>
</div>

<div class="nav">
  <button class="active" data-days="0" onclick="selectRange(0)">오늘</button>
  <button data-days="7" onclick="selectRange(7)">7일</button>
  <button data-days="30" onclick="selectRange(30)">30일</button>
</div>

<div class="grid">
  <div class="card">
    <h2>앱별 사용 시간</h2>
    <canvas id="appChart"></canvas>
  </div>
  <div class="card">
    <h2>앱 목록</h2>
    <div id="app-list"></div>
  </div>
  <div class="card card-full">
    <h2>시간대별 사용 내역</h2>
    <div class="chart-container">
      <canvas id="timelineChart"></canvas>
    </div>
  </div>
</div>

<div class="updating" id="update-info">실시간 업데이트 중...</div>

<script>
const COLORS = [
  '#58a6ff', '#3fb950', '#d29922', '#f85149', '#bc8cff',
  '#79c0ff', '#56d364', '#e3b341', '#ff7b72', '#d2a8ff',
  '#a5d6ff', '#7ee787', '#ffd33d', '#ffa198', '#c9d1d9'
];

let appChart = null;
let timelineChart = null;
let daysRange = 0; // 0 = today

function fmt(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function selectRange(days) {
  daysRange = days;
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.nav button[data-days="${days}"]`).classList.add('active');
  loadSummary();
}

async function loadToday() {
  try {
    const res = await fetch('/api/today');
    const data = await res.json();
    document.getElementById('total-time-display').textContent = fmt(data.total_seconds);
    document.getElementById('status-badge').innerHTML =
      `<span class="status-dot status-on"></span>연결됨`;

    // 현재 앱
    if (data.current_app) {
      document.getElementById('current-app-name').textContent = data.current_app;
    }

    // 앱 차트
    const labels = data.apps.map(a => a.name).slice(0, 10);
    const values = data.apps.map(a => a.seconds).slice(0, 10);

    if (appChart) { appChart.destroy(); }
    appChart = new Chart(document.getElementById('appChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values.map(v => (v / 60).toFixed(1)),
          backgroundColor: labels.map((_, i) => COLORS[i % COLORS.length]),
          borderRadius: 4,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: {
            title: { display: true, text: '분', color: '#8b949e' },
            ticks: { color: '#8b949e' },
            grid: { color: '#21262d' }
          },
          y: { ticks: { color: '#c9d1d9' }, grid: { display: false } }
        }
      }
    });

    // 앱 목록
    const listEl = document.getElementById('app-list');
    listEl.innerHTML = data.apps.slice(0, 15).map(a =>
      `<div class="app-list-item">
        <span class="app-list-name">${a.name}</span>
        <span class="app-list-time">${fmt(a.seconds)}</span>
      </div>`
    ).join('');

  } catch(e) {
    document.getElementById('status-badge').innerHTML =
      `<span class="status-dot status-off"></span>연결 오류`;
  }
}

async function loadTimeline() {
  try {
    const res = await fetch('/api/hourly');
    const data = await res.json();

    const hours = Array.from({length: 24}, (_, i) => `${String(i).padStart(2,'0')}:00`);
    const allApps = new Set();
    Object.values(data).forEach(h => Object.keys(h).forEach(a => allApps.add(a)));
    const appList = [...allApps].slice(0, 8);

    const datasets = appList.map((app, i) => ({
      label: app,
      data: hours.map(h => ((data[h] || {})[app] || 0) / 60),
      backgroundColor: COLORS[i % COLORS.length],
      borderRadius: 2,
    }));

    if (timelineChart) { timelineChart.destroy(); }
    timelineChart = new Chart(document.getElementById('timelineChart'), {
      type: 'bar',
      data: { labels: hours, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#8b949e', boxWidth: 12 } }
        },
        scales: {
          x: {
            stacked: true,
            ticks: { color: '#8b949e', maxTicksLimit: 12 },
            grid: { color: '#21262d' }
          },
          y: {
            stacked: true,
            title: { display: true, text: '분', color: '#8b949e' },
            ticks: { color: '#8b949e' },
            grid: { color: '#21262d' }
          }
        }
      }
    });
  } catch(e) { /* ignore */ }
}

async function loadSummary() {
  try {
    const end = new Date();
    const start = new Date();
    start.setDate(start.getDate() - daysRange);
    const params = new URLSearchParams({
      start: start.toISOString().slice(0,10),
      end: end.toISOString().slice(0,10)
    });
    // 일단 오늘 데이터로 대체 (summary는 향후 확장)
    await loadToday();
  } catch(e) { /* ignore */ }
}

function refresh() {
  loadToday();
  loadTimeline();
}

// 3초마다 갱신
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
